<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avenx i18n Example</title>
    <link rel="stylesheet" href="dist/bundle.css">
</head>
<body>
    <div id="app"></div>

    <!--
      The Avenx CLI compiles an application into one self-contained bundle, so a
      plugin reaches it through a global rather than an import. Load order does
      not matter: the plugin resolves the runtime the first time the application
      installs it, which is after the bundle has published the namespace.

      With a bundler (Vite, Rollup, webpack) drop this script and import
      @avenx/i18n normally instead.
    -->
    <script src="../dist/avenx-i18n.global.js"></script>
    <script src="dist/bundle.js"></script>
</body>
</html>
