# Dependabot: keeps our development tooling and docs site (/docs) up to date.
# Runs once a month (first of the month, UTC). For the package directories it
# only looks at devDependencies — runtime dependencies are intentionally left
# out so published version ranges stay under manual control. /docs is watched
# separately for its site dependencies.
version: 2

updates:
  - package-ecosystem: npm
    directories:
      # avenx-core: eslint, prettier, playwright, jsdoc, esbuild, terser, c8, ...
      - "/"
      # Vite plugin and its example app: vite
      - "/plugins/avenx-vite"
      - "/plugins/avenx-vite/example"
    schedule:
      interval: monthly
    allow:
      - dependency-type: development
    # Bump the range in package.json, not just the lockfile.
    versioning-strategy: increase
    # One PR per month for all minor/patch bumps; majors get their own PR
    # so breaking tooling changes can be reviewed on their own.
    groups:
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope

  # Documentation site (/docs): Astro, Starlight, and sharp are listed under
  # dependencies, so it needs its own entry without the dev-only filter.
  # Group minor/patch releases while leaving majors separate.
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: monthly
    groups:
      docs:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore
      include: scope

  # Update workflow actions monthly too. Group minor/patch releases while
  # leaving majors separate so breaking workflow changes get their own review.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore
      include: scope
