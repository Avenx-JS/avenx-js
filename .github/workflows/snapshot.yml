name: Compiler snapshots

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  compiler-snapshots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check compiler snapshots
        run: npm run test:snapshots
